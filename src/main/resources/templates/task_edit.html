<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edytuj zadanie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    .form-label { font-weight: 500; color: #495057; }
    .form-control { border-radius: 8px; padding: 12px; }
    .form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 0 0.25rem rgba(38, 143, 255, 0.25);
    }
    .btn { border-radius: 8px; padding: 10px 20px; }
    .btn-danger { background-color: #dc3545; border: none; }
    .btn-danger:hover { background-color: #c82333; }
    .btn-success { background-color: #28a745; border: none; }
    .btn-success:hover { background-color: #218838; }
    ul.assigned-users {
      list-style: none;
      padding-left: 0;
    }
    ul.assigned-users li {
      margin-bottom: 4px;
    }
  </style>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">

      <h2 class="mb-4"><i class="fas fa-pen me-2"></i> Edytuj zadanie</h2>

      <form th:action="@{/tasks/{id}/save(id=${task.taskId})}" method="post" id="editTaskForm">

        <div class="mb-3">
          <label class="form-label">Nazwa zadania</label>
          <input type="text" class="form-control" name="name" th:value="${task.name}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Opis</label>
          <textarea name="description" class="form-control" rows="4" th:text="${task.description}"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Termin wykonania</label>
          <input type="date" name="dueDate" class="form-control"
                 th:value="${#temporals.format(task.dueDate, 'yyyy-MM-dd')}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Wybierz projekt</label>
          <select class="form-control" name="projectId" required>
            <option value="">-- Wybierz projekt --</option>
            <option th:each="project : ${projects}"
                    th:value="${project.projectId}"
                    th:text="${project.name}"
                    th:selected="${project.projectId == task.project.projectId}">
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Użytkownicy przypisani do projektu</label>
          <ul class="assigned-users">
            <li th:each="user : ${task.project.users}">
              <i class="fas fa-user"></i>
              <span th:text="${user.firstName + ' ' + user.lastName + ' (' + user.numberIndex + ')'}">Imię Nazwisko</span>
            </li>
          </ul>
        </div>

        <div class="d-flex justify-content-between">
          <a class="btn btn-danger" th:href="@{/tasks}">
            <i class="fas fa-sign-out-alt"></i> Cofnij
          </a>
          <button type="submit" class="btn btn-success">
            <i class="fas fa-save"></i> Zapisz zmiany
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
