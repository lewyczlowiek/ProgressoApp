<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edytuj zadanie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3"><i class="fas fa-pen me-2"></i>Edytuj zadanie</h1>
        <a class="btn btn-secondary" th:href="@{/tasks}">
          <i class="fas fa-arrow-left me-2"></i>Wróć
        </a>
      </div>

      <form th:action="@{/tasks/{id}(id=${task.taskId})}" method="post" class="list-group shadow-sm">
        <div class="list-group-item list-group-item-action">

          <div class="mb-3">
            <label for="name" class="form-label">Nazwa zadania</label>
            <input type="text" id="name" name="name" class="form-control" th:value="${task.name}" required>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Opis</label>
            <textarea id="description" name="description" class="form-control" rows="3"
                      th:text="${task.description}"></textarea>
          </div>

          <div class="mb-3">
            <label for="taskStatus" class="form-label">Status</label>
            <select id="taskStatus" name="taskStatus" class="form-select" required>
              <option value="TO_DO" th:selected="${task.taskStatus == 'TO_DO'}">Nowe</option>
              <option value="IN_PROGRESS" th:selected="${task.taskStatus == 'IN_PROGRESS'}">W toku</option>
              <option value="DONE" th:selected="${task.taskStatus == 'DONE'}">Zakończone</option>
              <option value="CANCELED" th:selected="${task.taskStatus == 'CANCELED'}">Anulowane</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="dueDate" class="form-label">Termin wykonania</label>
            <input type="date" id="dueDate" name="dueDate" class="form-control"
                   th:value="${#temporals.format(task.dueDate, 'yyyy-MM-dd')}" required>
          </div>

          <div class="mb-3">
            <label for="projectId" class="form-label">ID projektu</label>
            <input type="number" id="projectId" name="projectId" class="form-control"
                   th:value="${task.project.projectId}" required>
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success">
              <i class="fas fa-save me-2"></i>Zapisz zmiany
            </button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>

<style>
  body {
    background-color: #f8f9fa;
    font-family: 'Segoe UI', sans-serif;
  }

  .list-group-item {
    border-left: 4px solid transparent;
    transition: all 0.2s ease;
    padding: 1rem;
    margin-bottom: 0.5rem;
    border-radius: 8px !important;
  }

  .list-group-item:hover {
    border-left-color: #0d6efd;
    background-color: #f8f9fa;
    transform: translateX(3px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, .08);
  }

  .form-label {
    font-weight: 500;
  }

  .btn-success {
    min-width: 140px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
