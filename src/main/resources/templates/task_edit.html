<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edytuj zadanie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
  <h2 class="mb-4">Edytuj zadanie</h2>

  <form th:action="@{/tasks/{id}/save(id=${task.taskId})}" method="post" class="card p-4 shadow">
    <div class="mb-3">
      <label for="name" class="form-label">Nazwa zadania</label>
      <input type="text" id="name" name="name" class="form-control" th:value="${task.name}" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Opis</label>
      <textarea id="description" name="description" class="form-control" rows="4"
                th:text="${task.description}"></textarea>
    </div>

    <div class="mb-3">
      <label for="taskStatus" class="form-label">Status</label>
      <select id="taskStatus" name="taskStatus" class="form-select">
        <option value="TO_DO" th:selected="${task.taskStatus == 'TO_DO'}">Nowe</option>
        <option value="IN_PROGRESS" th:selected="${task.taskStatus == 'IN_PROGRESS'}">W toku</option>
        <option value="DONE" th:selected="${task.taskStatus == 'DONE'}">Zakończone</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="dueDate" class="form-label">Termin wykonania</label>
      <input type="date" id="dueDate" name="dueDate" class="form-control"
             th:value="${task.dueDate != null ? task.dueDate.toString() : ''}">
    </div>

    <div class="d-flex justify-content-between">
      <a th:href="@{/tasks}" class="btn btn-secondary">← Wróć</a>
      <button type="submit" class="btn btn-success">Zapisz zmiany</button>
    </div>
  </form>
</div>
</body>
</html>
