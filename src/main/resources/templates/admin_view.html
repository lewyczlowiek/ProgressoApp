<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel administratora - Użytkownicy</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/navbar.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">
    <h2 class="mb-4">Użytkownicy</h2>
    <table class="table table-striped align-middle">
        <thead class="table-primary"> <!-- zmieniony kolor nagłówka na niebieski -->
        <tr>
            <th>ID</th>
            <th>Imię</th>
            <th>Nazwisko</th>
            <th>Email</th>
            <th>Numer indeksu</th>
            <th>Rola</th>
            <th>Nowe hasło</th>
            <th>Akcje</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <form th:action="@{'/admin/users/edit/' + ${user.userId}}" method="post">
                <td th:text="${user.userId}"></td>
                <td>
                    <input type="text" class="form-control" name="firstName" th:value="${user.firstName}" required>
                </td>
                <td>
                    <input type="text" class="form-control" name="lastName" th:value="${user.lastName}" required>
                </td>
                <td>
                    <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                </td>
                <td>
                    <input type="text" class="form-control" name="numberIndex" th:value="${user.numberIndex}" required>
                </td>
                <td>
                    <select class="form-select" name="role" required>
                        <option th:each="role : ${roles}" th:value="${role}"
                                th:selected="${role} == ${user.role}"
                                th:text="${role}"></option>
                    </select>
                </td>
                <td>
                    <input type="password" class="form-control" name="password" placeholder="Nowe hasło">
                </td>
                <td>
                    <button type="submit" class="btn btn-success btn-sm">Zapisz</button>
                    <button type="button" class="btn btn-danger btn-sm"
                            th:onclick="'if(confirm(\'Na pewno usunąć?\')){this.form.action=\'/admin/users/delete/' + ${user.userId} + '\'; this.form.submit();}'">
                        Usuń
                    </button>
                </td>
            </form>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
