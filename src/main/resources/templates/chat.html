<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Progresso - Chat</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">

  <!-- Bootstrap i FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .chat-container {
      max-width: 800px;
      margin: 100px auto 20px;
      background-color: #fff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    #message-list {
      list-style: none;
      padding: 0;
      max-height: 400px;
      overflow-y: auto;
    }

    #message-list li {
      margin-bottom: 10px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 5px;
      display: inline-block;
    }

    .my-message {
      background-color: #d4edda;
      color: #155724;
      text-align: right;
    }

    .other-message {
      background-color: #cce5ff;
      color: #004085;
      text-align: left;
    }

    .input-group {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<!-- Navbar jako fragment -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Kontener czatu -->
<div class="container chat-container">
  <h2>Chat</h2>

  <!-- Historia wiadomości -->
  <ul id="message-list">
    <li th:each="msg : ${messages}">
      <div th:class="'message ' + (${msg.from} == ${username} ? 'my-message' : 'other-message')">
        <strong th:text="${msg.from} == ${username} ? 'Ty' : ${msg.from}"></strong>:
        <span th:text="${msg.text}"></span>
      </div>
    </li>
  </ul>

  <!-- Wysyłanie wiadomości -->
  <div class="input-group">
    <input class="form-control" id="message-input" placeholder="Wpisz wiadomość..." type="text">
    <button class="btn btn-primary" id="send-btn" type="button">Wyślij</button>
  </div>
</div>

<!-- Skrypty -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  let username = /*[[${username}]]*/ 'Ty'; // Thymeleaf wstawi nazwę użytkownika
  // stompClient jest już zadeklarowany globalnie w navbar.html

  function appendMessage(from, text) {
    const ul = document.getElementById('message-list');
    const li = document.createElement('li');
    const isMine = from === username;
    const messageClass = isMine ? 'my-message' : 'other-message';
    const displayName = isMine ? 'Ty' : from;
    li.innerHTML = `<div class="message ${messageClass}"><strong>${displayName}:</strong> ${text}</div>`;
    ul.appendChild(li);
    ul.scrollTop = ul.scrollHeight;
  }

  $(document).ready(() => {
    $('#send-btn').click(() => {
      const messageInput = $('#message-input');
      const text = messageInput.val().trim();
      if (text && stompClient) {
        stompClient.send('/app/send', {}, JSON.stringify({text}));
        messageInput.val('');
      }
    });
  });
</script>


</body>
</html>
