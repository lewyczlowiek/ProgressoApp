<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj Zadanie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  <style>
    .btn-primary { background-color: #007bff; border-color: #007bff; }
    .btn-primary:hover { background-color: #0056b3; border-color: #0056b3; }
    .btn-outline-secondary:hover { background-color: #6c757d; border-color: #6c757d; color: white; }
    .btn-outline-danger:hover { background-color: #dc3545; border-color: #dc3545; color: white; }
    .btn-outline-primary:hover { background-color: #0d6efd; border-color: #0d6efd; color: white; }
    .btn-success:hover { background-color: #218838; }
    .header-row { margin-bottom: 2rem; }
    .form-label { font-weight: 500; color: #495057; }
    .form-control { border-radius: 8px; padding: 12px; }
    .form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 0 0.25rem rgba(38, 143, 255, 0.25);
    }
    .table th, .table td { padding: 12px; vertical-align: middle; }
    .table-striped tbody tr:nth-of-type(odd) { background-color: #f9f9f9; }
    .user-checkbox { margin-left: 10px; }
    .table th { background-color: #f1f1f1; color: #495057; }
    .form-check-label { font-weight: 500; }
    .form-check-input { border-radius: 5px; }
  </style>
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">

      <form th:action="@{/tasks/addTasks/{projectId}(projectId=${project.projectId})}" method="post" th:object="${task}">
        <!-- Nagłówek -->
        <div class="d-flex justify-content-between align-items-center header-row">
          <h2 class="h3 mb-0">
            <i class="fas fa-tasks me-2"></i>
            Dodaj nowe zadanie
          </h2>
          <a class="btn btn-outline-danger" th:href="@{/index}">
            <i class="fas fa-arrow-left me-1"></i> Cofnij
          </a>
        </div>

        <!-- Nazwa zadania -->
        <div class="mb-3">
          <label for="taskTitle" class="form-label">Nazwa zadania</label>
          <input type="text" class="form-control" id="taskTitle" th:field="*{name}" required>
        </div>

        <!-- Opis -->
        <div class="mb-3">
          <label for="taskDescription" class="form-label">Opis</label>
          <textarea class="form-control" id="taskDescription" th:field="*{description}" rows="4"></textarea>
        </div>

        <!-- Termin -->
        <div class="mb-3">
          <label for="dueDate" class="form-label">Termin wykonania</label>
          <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}" required>
        </div>

        <!-- Lista użytkowników -->
        <div class="mb-3">
          <label class="form-label">Wybierz użytkowników</label>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="selectAllCheckbox" />
            <label class="form-check-label" for="selectAllCheckbox">Wybierz wszystkich</label>
          </div>

          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
              <tr>
                <th>Imię</th>
                <th>Nazwisko</th>
                <th>Numer Indeksu</th>
                <th>Wybierz</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="user : ${assignedUsers}">
                <td th:text="${user.firstName}">Jan</td>
                <td th:text="${user.lastName}">Kowalski</td>
                <td th:text="${user.numberIndex}">12345</td>
                <td>
                  <input type="checkbox" class="user-checkbox" name="assignedUsersIds" th:value="${user.userId}" />
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Przyciski -->
        <div class="d-flex justify-content-end gap-2">
          <button type="submit" class="btn btn-success">
            <i class="fas fa-check me-1"></i> Dodaj zadanie
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('selectAllCheckbox').addEventListener('change', function () {
    const checked = this.checked;
    document.querySelectorAll('.user-checkbox').forEach(cb => {
      cb.checked = checked;
    });
  });
</script>
</body>
</html>
