<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Dodaj Zadanie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/navbar.css}">
  <style>
    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
    }

    .btn-primary:hover {
      background-color: #0056b3;
      border-color: #0056b3;
    }

    .btn-outline-secondary:hover {
      background-color: #6c757d;
      border-color: #6c757d;
      color: white;
    }

    .btn-outline-danger:hover {
      background-color: #dc3545;
      border-color: #dc3545;
      color: white;
    }

    .btn-outline-primary:hover {
      background-color: #0d6efd;
      border-color: #0d6efd;
      color: white;
    }

    .btn-success:hover {
      background-color: #218838;
    }

    .header-row {
      margin-bottom: 2rem;
    }

    .form-label {
      font-weight: 500;
      color: #495057;
    }

    .form-control {
      border-radius: 8px;
      padding: 12px;
    }

    .form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 0 0.25rem rgba(38, 143, 255, 0.25);
    }

    .table th, .table td {
      padding: 12px;
      vertical-align: middle;
    }

    .table-striped tbody tr:nth-of-type(odd) {
      background-color: #f9f9f9;
    }

    .user-checkbox {
      margin-left: 10px;
    }

    .table th {
      background-color: #f1f1f1;
      color: #495057;
    }

    .form-check-label {
      font-weight: 500;
    }

    .form-check-input {
      border-radius: 5px;
    }
  </style>
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">

      <form method="post" th:action="@{/tasks/addTasks/{projectId}(projectId=${project.projectId})}"
            th:object="${task}">
        <!-- Nagłówek -->
        <div class="d-flex justify-content-between align-items-center header-row">
          <h2 class="h3 mb-0">
            <i class="fas fa-tasks me-2"></i>
            Dodaj nowe zadanie
          </h2>
          <a class="btn btn-outline-danger" th:href="@{/index}">
            <i class="fas fa-arrow-left me-1"></i> Cofnij
          </a>
        </div>

        <!-- Nazwa zadania -->
        <div class="mb-3">
          <label class="form-label" for="taskTitle">Nazwa zadania</label>
          <input class="form-control" id="taskTitle" required th:field="*{name}" type="text">
        </div>

        <!-- Opis -->
        <div class="mb-3">
          <label class="form-label" for="taskDescription">Opis</label>
          <textarea class="form-control" id="taskDescription" rows="4"
                    th:field="*{description}"></textarea>
        </div>

        <!-- Termin -->
        <div class="mb-3">
          <label class="form-label" for="dueDate">Termin wykonania</label>
          <input class="form-control" id="dueDate" required th:field="*{dueDate}" type="date">
        </div>

        <!-- Lista użytkowników -->
        <div class="mb-3">
          <label class="form-label">Wybierz użytkowników</label>
          <div class="form-check mb-2">
            <input class="form-check-input" id="selectAllCheckbox" type="checkbox"/>
            <label class="form-check-label" for="selectAllCheckbox">Wybierz wszystkich</label>
          </div>

          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
              <tr>
                <th>Imię</th>
                <th>Nazwisko</th>
                <th>Numer Indeksu</th>
                <th>Wybierz</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="user : ${assignedUsers}">
                <td th:text="${user.firstName}">Jan</td>
                <td th:text="${user.lastName}">Kowalski</td>
                <td th:text="${user.numberIndex}">12345</td>
                <td>
                  <input class="form-check-input user-checkbox" name="selectedUsers" type="checkbox"
                         value="${user.userId}"/>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Przyciski -->
        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-success" type="submit">
            <i class="fas fa-check me-1"></i> Dodaj zadanie
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('selectAllCheckbox').addEventListener('change', function () {
    const checked = this.checked;
    document.querySelectorAll('.user-checkbox').forEach(cb => {
      cb.checked = checked;
    });
  });
</script>
</body>
</html>
