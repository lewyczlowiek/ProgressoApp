<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Rejestracja</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="register-container">
  <div th:if="${param.success}">
    <div class="alert alert-info">
      You've registered successfully
    </div>
  </div>
  <h2>Rejestracja</h2>
  <form method="post" role="form" th:action="@{/auth/register/save}" th:object="${user}">
    <div class="input-group">
      <label for="firstName">Imię</label>
      <input class="input-field" id="firstName" name="firstName" required th:field="*{firstName}"
             type="text">
    </div>
    <div class="input-group">
      <label for="lastName">Nazwisko</label>
      <input class="input-field" id="lastName" name="lastName" required th:field="*{lastName}"
             type="text">
    </div>
    <div class="input-group">
      <label for="email">Adres e-mail</label>
      <input class="input-field" id="email" name="email" required th:field="*{email}" type="email">
    </div>
    <div class="input-group">
      <label for="numberIndex">Numer Indeksu:</label>
      <input class="input-field" id="numberIndex" name="numberIndex" required
             th:field="*{numberIndex}" type="text">
    </div>
    <div class="input-group">
      <label for="password">Hasło</label>
      <input class="input-field" id="password" name="password" required th:field="*{password}"
             type="password">
    </div>
    <div class="input-group">
      <label for="confirm-password">Potwierdź hasło</label>
      <input class="input-field" id="confirm-password" name="confirm-password" required
             type="password">
    </div>
    <div class="terms">
      <input id="terms" name="terms" required type="checkbox">
      <label for="terms">Akceptuję <a href="privacy-policy" target="_blank">regulamin i politykę
        prywatności</a></label>
    </div>
    <button class="register-button" type="submit">Zarejestruj się</button>
  </form>
  <a href="/auth/login">Masz już konto? Zaloguj się</a>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const registerForm = document.querySelector('form');
    const termsCheckbox = document.getElementById('terms');

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!termsCheckbox.checked) {
        alert('Musisz zaakceptować regulamin i politykę prywatności!');
        return;
      }

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const numberIndex = document.getElementById('numberIndex').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alert('Hasła nie są takie same!');
        return;
      }

      const payload = {
        firstName,
        lastName,
        email,
        numberIndex,
        password
      };

      try {
        const response = await fetch('/auth/register/save', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          window.location.href = '/auth/register?success';
        } else {
          const data = await response.json();
          if (data.message && data.message.includes("email")) {
            alert("Ten adres e-mail jest już zarejestrowany.");
          } else {
            alert("Rejestracja nie powiodła się. Spróbuj ponownie.");
          }
        }
      } catch (error) {
        console.error(error);
        alert("Błąd połączenia z serwerem.");
      }
    });
  });
</script>


</body>
</html>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .register-container {
    background-color: white;
    padding: 2.5rem;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 380px;
  }

  h2 {
    margin-bottom: 1.5rem;
    color: #2c3e50;
    font-size: 1.8rem;
    text-align: center;
  }

  .input-group {
    margin-bottom: 1.2rem;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
    color: #2c3e50;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .input-field {
    width: 100%;
    padding: 0.8rem;
    border: 2px solid #e1e1e1;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }

  .input-field:focus {
    border-color: #3498db;
    outline: none;
  }

  .terms {
    display: flex;
    align-items: center;
    margin: 1rem 0;
    font-size: 0.9rem;
  }

  .terms input[type="checkbox"] {
    margin-right: 0.5rem;
  }

  .register-button {
    width: 100%;
    padding: 0.8rem;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .register-button:hover {
    background-color: #2980b9;
  }

  .links {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
  }

  .links span {
    color: #2c3e50;
  }

  .links a {
    color: #3498db;
    text-decoration: none;
    margin-left: 0.5rem;
    transition: color 0.3s ease;
  }

  .links a:hover {
    color: #2980b9;
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .register-container {
      width: 90%;
      padding: 1.5rem;
    }
  }
</style>
