<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Zadanie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #addTaskForm {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
            margin-top: 50px;
        }

        .form-label {
            font-weight: 500;
            color: #495057;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.25rem rgba(38, 143, 255, 0.25);
        }

        .table th, .table td {
            padding: 12px;
            vertical-align: middle;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f9f9f9;
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
        }

        .btn-success:hover {
            background-color: #218838;
        }
    </style>
</head>

<body class="bg-light">

<form th:action="@{/tasks}" method="post" id="addTaskForm">
    <h2>Dodaj nowe zadanie</h2>

    <div class="mb-3">
        <label for="taskTitle" class="form-label">Nazwa zadania</label>
        <input type="text" class="form-control" id="taskTitle" name="name" required>
    </div>

    <div class="mb-3">
        <label for="taskDescription" class="form-label">Opis</label>
        <textarea class="form-control" id="taskDescription" name="description" rows="4"></textarea>
    </div>

    <div class="mb-3">
        <label for="dueDate" class="form-label">Termin wykonania</label>
        <input type="date" class="form-control" id="dueDate" name="dueDate" required>
    </div>

    <div class="mb-3">
        <label for="projectSelect" class="form-label">Wybierz projekt</label>
        <select class="form-control" id="projectSelect" name="projectId" required>
            <option value="">-- Wybierz projekt --</option>
            <option th:each="project : ${projects}"
                    th:value="${project.projectId}"
                    th:text="${project.name}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Przypisz użytkowników</label>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="selectAllCheckbox" />
            <label class="form-check-label" for="selectAllCheckbox">Zaznacz wszystkich</label>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Imię</th>
                    <th>Nazwisko</th>
                    <th>Numer indeksu</th>
                    <th>Wybierz</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                <!-- Ładowane przez JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a class="btn btn-danger" th:href="@{/tasks}">
            <i class="fas fa-sign-out-alt"></i> Cofnij
        </a>
        <button type="submit" class="btn btn-success">
            <i class="fas fa-check"></i> Dodaj zadanie
        </button>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const projectSelect = document.getElementById('projectSelect');
    const usersTableBody = document.getElementById('usersTableBody');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');

    projectSelect.addEventListener('change', function () {
        const projectId = this.value;
        usersTableBody.innerHTML = '';

        if (!projectId) return;

        fetch(`/api/project/${projectId}/users`)
            .then(response => response.json())
            .then(users => {
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
            <td>${user.firstName}</td>
            <td>${user.lastName}</td>
            <td>${user.numberIndex}</td>
            <td>
              <input type="checkbox" class="form-check-input user-checkbox" name="assignedUsersIds" value="${user.userId}" />
            </td>
          `;
                    usersTableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error("Błąd podczas ładowania użytkowników:", error);
            });
    });

    selectAllCheckbox.addEventListener('change', function () {
        const checked = this.checked;
        document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = checked);
    });

    window.addEventListener('DOMContentLoaded', () => {
        if (projectSelect.value) {
            projectSelect.dispatchEvent(new Event('change'));
        }
    });
</script>

</body>
</html>
