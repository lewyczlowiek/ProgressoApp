<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły projektu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #343a40;
        }

        .header-row {
            margin-bottom: 2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #dee2e6;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .project-details {
            background-color: #fff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.05);
        }

        .project-details h4 {
            color: #495057;
            margin-bottom: 1rem;
        }

        .project-details p {
            color: #6c757d;
            margin-bottom: 0.75rem;
        }

        .project-details strong {
            font-weight: 500;
            color: #343a40;
        }

        .user-list {
            padding-left: 20px; /* Dodane wcięcie dla numerów */
        }

        .user-list li {
            margin-bottom: 0.5rem;
            color: #6c757d;
        }

        .user-count {
            font-style: italic;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }

        .kanban-board {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .kanban-column {
            width: 300px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .kanban-column h3 {
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            color: #333;
        }

        .task-card {
            background-color: #e4e5e6;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .task-card:hover {
            background-color: #d1d3d4;
        }

        .kanban-column input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .kanban-column button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .kanban-column button:hover {
            background-color: #0056b3;
        }

        .add-task-button {
            display: block;
            margin: 40px auto 30px auto; /* Dostosowane marginesy: 40px u góry, 30px do tablicy */
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .add-task-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <!-- Nagłówek -->
            <div class="d-flex justify-content-between align-items-center header-row">
                <h1 class="h3 mb-0">
                    <i class="fas fa-folder-open me-2"></i>
                    Szczegóły projektu
                </h1>
                <a class="btn btn-primary" th:href="@{/index}" role="button">
                    <i class="fas fa-arrow-left me-1"></i>
                    Wróć do listy projektów
                </a>
            </div>

            <!-- Szczegóły projektu -->
            <div class="project-details">
                <h4><strong>Nazwa:</strong> <span th:text="${project.name}">Nazwa Projektu</span></h4>
                <p><strong>Opis:</strong> <span th:text="${project.description}">Opis projektu</span></p>
                <p><strong>Data utworzenia:</strong> <span th:text="${#temporals.format(project.creationTimestamp, 'yyyy-MM-dd HH:mm')}">2025-06-12 14:00</span></p>
                <p><strong>Data ukończenia:</strong> <span th:text="${#temporals.format(project.endDateTime, 'yyyy-MM-dd HH:mm')}">2025-06-12 14:00</span></p>

                <h5>Przypisani użytkownicy:</h5>
                <p class="user-count" th:text="'Liczba użytkowników: ' + ${users.size()}"></p>
                <ol class="user-list">
                    <th:block th:each="user, iterStat : ${users}">
                        <li>
                            <strong th:text="${user.firstName}">Imię użytkownika</strong>
                            <span th:text="${user.lastName}">Nazwisko użytkownika</span> |
                            <span th:text="${user.numberIndex}">Numer indeksu</span>
                        </li>
                    </th:block>
                </ol>
            </div>

            <!-- Ogólny przycisk do dodawania zadania -->
            <button class="add-task-button" onclick="openAddTaskDialog()">Dodaj zadanie</button>

            <!-- Tablica Kanban -->
            <div class="kanban-board">
                <!-- Do zrobienia -->
                <div class="kanban-column" id="todo">
                    <h3>Do zrobienia</h3>
                    <div id="todo-list"></div>
                </div>

                <!-- W trakcie -->
                <div class="kanban-column" id="in-progress">
                    <h3>W trakcie</h3>
                    <div id="in-progress-list"></div>
                </div>

                <!-- Zakończone -->
                <div class="kanban-column" id="done">
                    <h3>Zakończone</h3>
                    <div id="done-list"></div>
                </div>
            </div>

        </div>
    </div>
</main>

<script>
    // Funkcja do otwierania okna dialogowego i dodawania zadania
    function openAddTaskDialog() {
        const taskText = prompt("Wpisz nazwę zadania:");
        if (taskText) {
            addTask('todo', taskText); // Domyślnie zadanie trafia do kolumny 'Do zrobienia'
        }
    }

    // Funkcja do dodawania zadania
    function addTask(column, taskText) {
        const taskCard = document.createElement("div");
        taskCard.classList.add("task-card");
        taskCard.textContent = taskText;

        document.getElementById(`${column}-list`).appendChild(taskCard);
    }

    // Funkcja do przenoszenia zadań między kolumnami
    const columns = document.querySelectorAll(".kanban-column");

    columns.forEach(column => {
        column.addEventListener("dragover", (e) => {
            e.preventDefault();
            const dragging = document.querySelector(".dragging");
            column.appendChild(dragging);
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
