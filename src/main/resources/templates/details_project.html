<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Szczegóły projektu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #343a40;
        }

        .header-row {
            margin-bottom: 2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #dee2e6;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .project-details {
            background-color: #fff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.05);
        }

        .project-details h4 {
            color: #495057;
            margin-bottom: 1rem;
        }

        .project-details p {
            color: #6c757d;
            margin-bottom: 0.75rem;
        }

        .project-details strong {
            font-weight: 500;
            color: #343a40;
        }

        .user-list {
            padding-left: 20px; /* Dodane wcięcie dla numerów */
        }

        .user-list li {
            margin-bottom: 0.5rem;
            color: #6c757d;
        }

        .user-count {
            font-style: italic;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <!-- Nagłówek -->
            <div class="d-flex justify-content-between align-items-center header-row">
                <h1 class="h3 mb-0">
                    <i class="fas fa-folder-open me-2"></i>
                    Szczegóły projektu
                </h1>
                <a class="btn btn-primary" th:href="@{/index}" role="button">
                    <i class="fas fa-arrow-left me-1"></i>
                    Wróć do listy projektów
                </a>
            </div>

            <!-- Szczegóły projektu -->
            <div class="project-details">
                <h4><strong>Nazwa:</strong> <span th:text="${project.name}">Nazwa Projektu</span></h4>
                <p><strong>Opis:</strong> <span th:text="${project.description}">Opis projektu</span></p>
                <p><strong>Data utworzenia:</strong> <span th:text="${#temporals.format(project.creationTimestamp, 'yyyy-MM-dd HH:mm')}">2025-06-12 14:00</span></p>
                <p><strong>Data ukończenia:</strong> <span th:text="${#temporals.format(project.endDateTime, 'yyyy-MM-dd HH:mm')}">2025-06-12 14:00</span></p>

                <h5>Przypisani użytkownicy:</h5>
                <p class="user-count" th:text="'Liczba użytkowników: ' + ${users.size()}"></p>
                <ol class="user-list">
                    <th:block th:each="user, iterStat : ${users}">
                        <li>
                            <strong th:text="${user.firstName}">Imię użytkownika</strong>
                            <span th:text="${user.lastName}">Nazwisko użytkownika</span> |
                            <span th:text="${user.numberIndex}">Numer indeksu</span>
                        </li>
                    </th:block>
                </ol>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS (Bundle - includes Popper.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
