<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Szczegóły zadania</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

        rel="stylesheet">

<body class="bg-light">

<div class="container mt-4">
  <div class="row">
    <div class="col-lg-8 mx-auto">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4"><i class="fas fa-info-circle me-2"></i>Szczegóły zadania</h1>
        <a class="btn btn-secondary" th:href="@{/tasks}"><i class="fas fa-arrow-left me-2"></i>Wróć</a>
      </div>

      <!-- Edycja zadania -->
      <form id="updateTaskForm">
        <div class="list-group-item">

          <div class="mb-3">
            <label class="form-label">Nazwa zadania</label>
            <input class="form-control" name="name" required th:value="${task.name}" type="text">
          </div>

          <div class="mb-3">
            <label class="form-label">Opis</label>
            <textarea class="form-control" name="description" rows="3"
                      th:text="${task.description}"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="taskStatus" required>
              <option th:selected="${task.taskStatus == 'TO_DO'}" value="TO_DO">Nowe</option>
              <option th:selected="${task.taskStatus == 'IN_PROGRESS'}" value="IN_PROGRESS">W toku
              </option>
              <option th:selected="${task.taskStatus == 'DONE'}" value="DONE">Zakończone</option>
              <option th:selected="${task.taskStatus == 'CANCELED'}" value="CANCELED">Anulowane
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Termin</label>
            <input class="form-control" name="dueDate" required
                   th:value="${#temporals.format(task.dueDate, 'yyyy-MM-dd')}" type="date">
          </div>

          <div class="mb-3">
            <label class="form-label">Kolejność zadania</label>
            <input class="form-control" name="taskOrder" required
                   th:value="${task.taskOrder}" type="number">
          </div>

          <div class="mb-3">
            <label class="form-label">ID projektu</label>
            <input class="form-control" name="projectId" required
                   th:value="${task.project.projectId}" type="number">
          </div>

          <div class="d-flex justify-content-end">
            <button class="btn btn-success" type="submit">
              <i class="fas fa-save me-2"></i>Zapisz zmiany
            </button>
          </div>
        </div>
      </form>

      <!--      &lt;!&ndash; Przesyłanie pliku &ndash;&gt;-->

    </div>

<script>

  document.getElementById("updateTaskForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const form = e.target;
const taskId = document.getElementById("updateTaskForm").dataset.taskId;

   const taskData = {
  name: form.name.value,
  description: form.description.value,
  taskOrder: parseInt(form.taskOrder.value),
  taskStatus: form.taskStatus.value,
  projectId: parseInt(form.projectId.value),
  dueDate: form.dueDate.value
};

console.log(taskData)
    try {
      const response = await fetch(`/api/tasks/${taskId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(taskData)
      });

      if (!response.ok) {
        throw new Error("Nie udało się zaktualizować zadania.");
      }

      // np. przekieruj po sukcesie
      window.location.href = `/project/details/${taskData.projectId}`;
    } catch (err) {
      alert("Błąd: " + err.message);
    }
  });
</script>
