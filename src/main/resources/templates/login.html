<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Strona Logowania</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-container">
  <h2>Logowanie</h2>
  <form id="login-form" role="form">
    <div class="input-group">
      <label for="username">Email</label>
      <input class="input-field" id="username" name="username" required type="text">
    </div>

    <div class="input-group">
      <label for="password">Hasło</label>
      <input class="input-field" id="password" name="password" required type="password">
    </div>

    <div class="remember-me">
      <input id="remember" name="remember" type="checkbox">
      <label for="remember">Zapamiętaj mnie</label>
    </div>

    <button class="login-button" type="submit">Zaloguj się</button>
  </form>
  <div class="links">
    <a class="forgot-password" href="/auth/register">Zapomniałeś hasła?</a>
    <a class="register-link" href="/auth/register">Zarejestruj się</a>
  </div>
</div>

<script>
  // Pobieramy formularz
  const loginForm = document.getElementById('login-form');

  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();  // Zapobiegamy domyślnemu przesyłaniu formularza

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    // Tworzymy obiekt JSON
    const loginData = {
      username: username,
      password: password,
      remember: remember
    };

    // Wysyłamy dane za pomocą fetch
    try {
      const response = await fetch('/auth/login/add', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(loginData)
      });

      if (response.ok) {
        // Jeśli odpowiedź jest ok, przekierowujemy lub pokazujemy sukces
        window.location.href = '/auth/login/success'; // lub inna strona po udanym logowaniu
      } else {
        // Jeśli coś poszło nie tak, wyświetlamy komunikat o błędzie
        alert('Nie udało się zalogować. Sprawdź dane logowania.');
      }
    } catch (error) {
      alert('Wystąpił błąd podczas logowania.');
      console.error(error);
    }
  });
</script>
</body>
</html>
