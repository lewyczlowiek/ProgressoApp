<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista projektów</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <style>
        /* Dodatkowe style dla lepszego wyglądu */
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            border-color: #6c757d;
            color: white;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .list-group-item-action:hover {
            background-color: #f8f9fa;
        }

        .list-group-item-action {
            transition: background-color 0.3s ease;
        }

        /* Style dla przycisków obok siebie */
        .button-group {
            display: flex;
            gap: 0.5rem; /* Odstęp między przyciskami */
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3"><i class="fas fa-folder-open me-2"></i>Lista projektów</h1>
                <div>
                    <a class="btn btn-primary" th:href="@{/api/project/add}" role="button">
                        <i class="fas fa-plus me-1"></i> Nowy Projekt
                    </a>
                </div>
            </div>
            <div class="list-group shadow-sm" id="projects-list">
                <th:block th:each="project : ${projects}">
                    <a class="list-group-item list-group-item-action" href="#" role="button">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1" th:text="${project.name}">Nazwa Projektu</h5>
                                <small class="text-muted" th:text="${#temporals.format(project.creationTimestamp, 'yyyy-MM-dd HH:mm')}">Utworzono: 2025-06-10</small>
                            </div>
                            <div class="button-group">
                                <!-- Przycisk edycji -->
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/api/project/edit/{id}(id=${project.projectId})}" role="button">
                                    <i class="fas fa-edit me-2"></i> Edytuj
                                </a>
                                <!-- Przycisk usuwania -->
                                <a class="btn btn-sm btn-outline-danger" th:href="@{/api/project/delete/{id}(id=${project.projectId})}" role="button">
                                    <i class="fas fa-trash me-2"></i> Usuń
                                </a>
                            </div>
                        </div>
                    </a>
                </th:block>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS (Bundle - includes Popper.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
