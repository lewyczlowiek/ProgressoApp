<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wybór osób</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <style>
        /* Dodatkowe style dla lepszego wyglądu */
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .table-striped tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3"><i class="fas fa-users me-2"></i>Wybór osób</h1>
            </div>
            <div class="table-responsive">
                <!-- Formularz do przypisania użytkowników -->
                <form action="#" method="post" th:action="@{/api/project/add-person/{projectId}(projectId=${project.projectId})}">
                    <input type="hidden" name="selectedUsers" value=""/>  <!-- Dodajemy ukryte pole -->

                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Imię</th>
                            <th>Nazwisko</th>
                            <th>Numer Indeksu</th>
                            <th>Wybierz</th>
                        </tr>
                        </thead>
                        <tbody>
                        <th:block th:each="user : ${users}">
                            <tr>
                                <td th:text="${user.firstName}">Imię</td>
                                <td th:text="${user.lastName}">Nazwisko</td>
                                <td th:text="${user.numberIndex}">Numer Indeksu</td>
                                <td>
                                    <!-- Sprawdzamy, czy użytkownik jest przypisany do projektu -->
                                    <input type="checkbox" name="selectedUsers" th:value="${user.userId}"
                                           th:checked="${project.users.contains(user)}" />
                                </td>
                            </tr>
                        </th:block>
                        </tbody>
                    </table>
                    <button type="submit" class="btn btn-primary">Zapisz zmiany</button>
                </form>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
